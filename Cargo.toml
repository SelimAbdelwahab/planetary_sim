[profile.release]
strip = true

[package]
name = "hello_rust"
version = "0.1.0"
edition = "2024"
autobins = false

[dependencies]
macroquad = "0.4.14"
anyhow = "1.0"
winit = { version = "0.30" }
env_logger = "0.10"
log = "0.4"
wgpu = "27.0.0"
pollster = "0.3"
bytemuck = { version = "1.24", features = [ "derive" ] }
glam = "0.30.9"
once_cell = "1.21.3"
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.6"
console_log = "1.0"
wgpu = { version = "27.0.0", features = ["webgl"]}
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.30"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
]}


[[bin]]
name = "hello_rust"
path = "src/app.rs"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[dependencies.image]
version = "0.24"
default-features = false
features = ["png", "jpeg"]
